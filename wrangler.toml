name = "chuan-zi-online"
main = ".scratch/cloudflare/bundle/worker.js"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
find_additional_modules = true

[build]
command = "npm run cloudflare:build"

[[rules]]
type = "Data"
globs = ["**/*.gz"]
fallthrough = true

[vars]
ALLOWED_ORIGINS = "https://crisply2404.github.io,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]
