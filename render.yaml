services:
  - type: web
    name: chuan-zi-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://crisply2404.github.io
